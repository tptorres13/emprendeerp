{% extends "layouts/app.html" %}
{% block head_title %}Mi negocio{% endblock %}
{% block content %}
<h1 class="page-title">Mi negocio</h1>
<p class="mt-1 text-slate-600">Los datos básicos de tu negocio.</p>
<section class="card mt-6 max-w-lg">
  <form method="post" class="space-y-6">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn-primary w-full sm:w-auto">Guardar cambios</button>
  </form>
</section>
{% endblock %}
