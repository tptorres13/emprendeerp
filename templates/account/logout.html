{% extends "layouts/entrance.html" %}
{% block head_title %}Cerrar sesión{% endblock %}
{% block content %}
<h1 class="page-title">¿Querés cerrar sesión?</h1>
<form method="post" action="{% url 'account_logout' %}" class="mt-6 flex flex-col gap-3">
  {% csrf_token %}
  {{ redirect_field }}
  <button type="submit" class="btn-primary w-full">Sí, cerrar sesión</button>
  <a href="{% url 'home' %}" class="btn-secondary w-full">No, volver</a>
</form>
{% endblock %}
