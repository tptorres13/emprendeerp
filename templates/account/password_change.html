{% extends "layouts/app.html" %}
{% block head_title %}Mi cuenta{% endblock %}
{% block content %}
<h1 class="page-title">Mi cuenta</h1>
<p class="mt-1 text-slate-600">{{ user.full_name }} · {{ user.email }}</p>
<section class="card mt-6 max-w-lg">
  <h2 class="mb-4 text-lg font-bold text-slate-900">Cambiar contraseña</h2>
  <form method="post" action="{% url 'account_change_password' %}" class="space-y-6">
    {% csrf_token %}
    {{ redirect_field }}
    {{ form }}
    <button type="submit" class="btn-primary w-full sm:w-auto">Guardar contraseña</button>
  </form>
</section>
<form method="post" action="{% url 'account_logout' %}" class="mt-6 md:hidden">{% csrf_token %}
  <button class="btn-secondary w-full">Cerrar sesión</button>
</form>
{% endblock %}
