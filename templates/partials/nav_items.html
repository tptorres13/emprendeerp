{% load nav %}
{% for item in nav_items %}
  {% if variant == "side" %}
  <a href="{{ item.url }}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold {% if item.active %}bg-brand-50 text-brand-800{% else %}text-slate-700 hover:bg-slate-100{% endif %}"{% if item.active %} aria-current="page"{% endif %}>
    {% icon item.icon "size-5" %}{{ item.label }}
  </a>
  {% else %}
  <a href="{{ item.url }}" class="flex min-h-16 flex-col items-center justify-center gap-1 text-xs font-semibold {% if item.active %}text-brand-700{% else %}text-slate-500{% endif %}"{% if item.active %} aria-current="page"{% endif %}>
    {% icon item.icon "size-6" %}{{ item.label }}
  </a>
  {% endif %}
{% endfor %}
