{% load static tailwind_cli %}<!DOCTYPE html>
<html lang="es-AR" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>{% block head_title %}{% endblock %}{% if self.head_title %} · {% endif %}{{ PRODUCT_NAME }}</title>
  {% tailwind_css %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full font-sans text-slate-800 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
  {% include "partials/messages.html" %}
  {% block extra_body %}{% endblock %}
</body>
</html>
