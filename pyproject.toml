[project]
name = "emprende-erp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<5.3",
    "django-allauth>=65.22.1",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-tailwind-cli>=4.10.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Spanish text uses ¿ ¡ and typographic quotes on purpose
    "RUF012",                      # Django class attributes (Meta, fields) are fine mutable
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]
"apps/core/templatetags/nav.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:allauth.*",
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
