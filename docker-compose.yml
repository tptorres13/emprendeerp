# Local development environment.
#   docker compose up --build      -> app at http://localhost:8000
#   emails sent by the app          -> http://localhost:8025 (Mailpit)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  web:
    build:
      context: .
      target: dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createcachetable &&
             python manage.py tailwind runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://erp:erp@db:5432/erp
      EMAIL_URL: smtp://mailpit:1025
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
